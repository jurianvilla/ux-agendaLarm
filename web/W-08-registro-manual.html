<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registra tu horario compromiso por compromiso en AgendaLarm.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
  <title>AgendaLarm — Registro manual</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="pantalla">
    <img class="fondo-decorativo" src="assets/fondo-z3.svg" alt="" aria-hidden="true">
    <main class="pantalla__contenido">
      <h1 class="pantalla__titulo">Registro manual</h1>

      <form class="formulario">
        <div class="fila-campos">
          <div class="campo">
            <label for="dia">Día</label>
            <input type="text" id="dia" value="Lunes">
          </div>
          <div class="campo">
            <label for="hora">Hora</label>
            <input type="text" id="hora" value="08:00">
          </div>
          <div class="campo">
            <label for="actividad">Actividad</label>
            <input type="text" id="actividad" placeholder="Nueva actividad">
          </div>
        </div>

        <button type="button" class="boton boton--secundario" data-agregar-compromiso="#lista-compromisos">+ Agregar compromiso</button>
      </form>

      <ul class="lista-verificacion" id="lista-compromisos">
        <li>
          <span>Lun · 08:00 · Cálculo I</span>
          <button type="button" class="lista-editable__boton" data-quitar-fila aria-label="Eliminar compromiso">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"></path>
            </svg>
          </button>
        </li>
        <li>
          <span>Mar · 10:00 · Reunión equipo</span>
          <button type="button" class="lista-editable__boton" data-quitar-fila aria-label="Eliminar compromiso">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"></path>
            </svg>
          </button>
        </li>
        <li>
          <span>Mié · 14:00 · Clase Bases de Datos</span>
          <button type="button" class="lista-editable__boton" data-quitar-fila aria-label="Eliminar compromiso">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"></path>
            </svg>
          </button>
        </li>
      </ul>

      <div class="formulario">
        <a class="boton boton--secundario" href="W-12-direcciones-margen.html">Guardar y continuar</a>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
