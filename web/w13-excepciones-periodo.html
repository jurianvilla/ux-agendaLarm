<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestiona las excepciones del periodo: festivos automáticos y tus propias excepciones.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
  <title>AgendaLarm — Excepciones del periodo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="pantalla">
    <img class="fondo-decorativo" src="assets/fondo-z3.svg" alt="" aria-hidden="true">
    <main class="pantalla__contenido">
      <h1 class="pantalla__titulo">Excepciones del periodo</h1>

      <div class="formulario">
        <div class="seccion-encabezado">
          <span class="seccion-encabezado__texto">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3v14"/><path d="M5 4h9l-2 3 2 3H5Z"/>
            </svg>
            Excepciones automáticas
          </span>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="10" cy="10" r="7.3"/><line x1="10" y1="9" x2="10" y2="14"/><circle cx="10" cy="6.5" r="0.9" fill="currentColor" stroke="none"/>
          </svg>
        </div>

        <div class="fila-interruptor">
          <span>Festivo 7 de agosto</span>
          <label class="interruptor">
            <input type="checkbox" checked>
            <span class="interruptor__pista"></span>
          </label>
        </div>
        <div class="fila-interruptor">
          <span>Festivo 18 de agosto</span>
          <label class="interruptor">
            <input type="checkbox" checked>
            <span class="interruptor__pista"></span>
          </label>
        </div>

        <p class="pantalla__texto-ayuda">precargado automáticamente, puedes desactivarlo</p>

        <hr class="separador">

        <div class="seccion-encabezado">
          <span class="seccion-encabezado__texto">Tus excepciones</span>
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 3.5l3 3L7 16l-3.5.5L4 13z"/>
          </svg>
        </div>

        <ul class="lista-excepciones">
          <li>
            Tutoría quincenal
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="10" cy="16" r="1.4"/></svg>
          </li>
          <li>
            Turno rotativo martes
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="10" cy="16" r="1.4"/></svg>
          </li>
        </ul>

        <button type="button" class="boton boton--secundario">+ Agregar excepción</button>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
